<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 170" width="700" height="170">
  <style>
    .font-base {
      font-family: 'Lucida Console', Monaco, 'Courier New', monospace;
      text-anchor: middle;
    }

    .name-blink {
      font-size: 28px;
      letter-spacing: 4px;
      font-weight: bold;
      fill: #33FF33;
      animation: crt-blink 1.2s step-end infinite;
    }

