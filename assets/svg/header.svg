  <rect x="2" y="2" width="696" height="166" fill="#0A1F0A" stroke="#33FF33" stroke-width="2" />

  <rect x="2" y="2" width="696" height="28" fill="#123312" stroke="#33FF33" stroke-width="1.5" />
