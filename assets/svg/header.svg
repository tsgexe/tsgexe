  <text x="350" y="112" class="font-base sub-text">[ COMPUTER ENGINEERING STUDENT • SOFTWARE DEVELOPER ]</text>

  <line x1="15" y1="135" x2="685" y2="135" stroke="#33FF33" stroke-width="1" stroke-dasharray="4 3" opacity="0.4" />

  <text x="30" y="152" class="titlebar-text">●</text>
  <text x="45" y="152" class="titlebar-text" font-size="12px">ACTIVE</text>
