<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 50" width="600" height="50">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=VT323&amp;display=swap');
    .name-blink {
      font-family: 'VT323', 'Consolas', monospace;
      font-size: 38px;
      letter-spacing: 4px;
      fill: #33FF33;
      text-anchor: middle;
      animation: retro-blink 1.2s step-end infinite;
    }
    @keyframes retro-blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
  <text x="300" y="38" class="name-blink">TOMÁS GONZÁLEZ</text>
</svg>
